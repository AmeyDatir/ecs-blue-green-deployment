version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 349660737678.dkr.ecr.us-east-1.amazonaws.com

  build:
    commands:
      - echo Build started
      - docker build -t ecs-blue -f Dockerfile.blue .
      - docker tag ecs-blue:latest 349660737678.dkr.ecr.us-east-1.amazonaws.com/ca-container-registry:blue

  post_build:
    commands:
      - echo Pushing image...
      - docker push 349660737678.dkr.ecr.us-east-1.amazonaws.com/ca-container-registry:blue
      - echo Creating imagedefinitions.json...
      - printf '[{"name":"ecs-container","imageUri":"349660737678.dkr.ecr.us-east-1.amazonaws.com/ca-container-registry:blue"}]' > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
    - appspec.yaml