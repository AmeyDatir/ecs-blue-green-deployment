version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 349660737678.dkr.ecr.us-east-1.amazonaws.com

  build:
    commands:
      - echo Build started
      - docker build -t ecs-app .
      - docker tag ecs-app:latest 349660737678.dkr.ecr.us-east-1.amazonaws.com/ca-container-registry:latest

  post_build:
    commands:
      - echo Pushing image...
      - docker push 349660737678.dkr.ecr.us-east-1.amazonaws.com/ca-container-registry:latest